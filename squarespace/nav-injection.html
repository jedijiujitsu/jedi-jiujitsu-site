<!--
  ============================================================
  SQUARESPACE FOOTER CODE INJECTION — SITE-WIDE NAV
  ============================================================
  This is our custom nav bar, replacing Bedford's built-in
  #header navigation. It renders on EVERY page (homepage,
  blog, coach subpages, etc.).

  Where this goes:
    Settings > Advanced > Code Injection > FOOTER
    (NOT Header — Header injection lands inside <head> where
    visible HTML cannot render.)

  This file is self-contained: markup + inline JS. No external
  file references. CSS comes from the Custom CSS panel
  (squarespace/custom-css.css).

  IMPORTANT: The header-injection.html file goes in the HEADER
  field. This file goes in the FOOTER field. Do not mix them up.
  ============================================================
-->

<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a href="/" class="logo" aria-label="Jedi Jiu-Jitsu — Home">
      <!-- ============================================================
           LOGO PATH — PLACEHOLDER
           ============================================================
           The logo SVG must be uploaded to Squarespace's asset library:
             Settings > Design > Logo & Title, or upload via the
             file manager. Then replace the src below with the CDN URL
             Squarespace assigns, e.g.:
             https://images.squarespace-cdn.com/content/v1/.../jedi-logo.svg

           The relative path "images/logo/jedi-logo.svg" only works
           for local preview — it will NOT resolve when injected
           site-wide via Code Injection.
           ============================================================ -->
      <img src="https://images.squarespace-cdn.com/content/v1/5b2533f0365f0205293cab6b/92373573-9130-4bfb-a985-5407e9f6e657/Copy+of+Jedi+Jiu+Jitsu+Final.png?format=500w" alt="Jedi Jiu-Jitsu" class="logo-img">
    </a>
    <nav class="nav-links">
      <a href="/#programs">Programs</a>
      <a href="/#schedule">Schedule</a>
      <a href="/#coaches">Coaches</a>
      <a href="/current-news">Current News</a>
      <a href="/#about">About</a>
      <a href="/#visit">Visit</a>
    </nav>
    <!-- Gymdesk signup URL — must match TRIAL_URL in src/scripts.js -->
    <a href="https://jedi-jiu-jitsu.gymdesk.com/signup/v/l4040" class="btn-red desktop" target="_blank" rel="noopener">Free Class &rarr;</a>
    <button class="menu-toggle" id="menu-toggle" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="/#programs" class="link">Programs</a>
    <a href="/#schedule" class="link">Schedule</a>
    <a href="/#coaches" class="link">Coaches</a>
    <a href="/current-news" class="link">Current News</a>
    <a href="/#about" class="link">About</a>
    <a href="/#visit" class="link">Visit</a>
    <!-- Gymdesk signup URL — must match TRIAL_URL in src/scripts.js -->
    <a href="https://jedi-jiu-jitsu.gymdesk.com/signup/v/l4040" class="btn-mobile" target="_blank" rel="noopener">Free Trial Class &rarr;</a>
  </div>
</header>

<script>
(function() {
  // Mobile menu toggle
  var toggle = document.getElementById('menu-toggle');
  var menu = document.getElementById('mobile-menu');
  if (toggle && menu) {
    toggle.addEventListener('click', function() { menu.classList.toggle('open'); });
    var links = menu.querySelectorAll('a');
    for (var i = 0; i < links.length; i++) {
      links[i].addEventListener('click', function() { menu.classList.remove('open'); });
    }
  }

  // Cross-page fade transition for nav links
  var navHeader = document.getElementById('nav');
  if (navHeader) {
    var navLinks = navHeader.querySelectorAll('a[href]');
    for (var j = 0; j < navLinks.length; j++) {
      (function(a) {
        var href = a.getAttribute('href');
        if (!href) return;
        var isExternal = /^https?:\/\//i.test(href) && href.indexOf('jjjtulsajiu-jitsu.com') === -1;
        var isHash = href.charAt(0) === '#' || href.indexOf('tel:') === 0 || href.indexOf('mailto:') === 0;
        if (isExternal || isHash) return;
        a.addEventListener('click', function(e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1 || a.target === '_blank') return;
          e.preventDefault();
          document.body.classList.add('page-fading');
          setTimeout(function() { window.location.href = href; }, 320);
        });
      })(navLinks[j]);
    }
  }
})();
</script>
